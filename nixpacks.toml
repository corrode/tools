[phases.setup]
nixPkgs = ["chromium", "glib", "openssl", "sqlite", "file"]

[staticAssets]
assets = "./assets"

[phases.build]
cmds = [
  'cargo build --release --workspace',
  'mkdir -p /app/bin',
  'cp target/release/server /app/bin/',
  'cp target/release/crawler /app/bin/',
  'ls -la /app/bin',
  'file /app/bin/server',
]

[start]
cmd = "/app/bin/server"
