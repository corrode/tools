<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Query Log - Monitoring - Rust Search</title>
        <link rel="stylesheet" href="/static/css/base.css" />
        <link rel="stylesheet" href="/static/css/monitoring.css" />
    </head>
    <body>
        <div class="monitoring-container">
            <div class="monitoring-header">
                <h1>Query Log</h1>
                <nav class="monitoring-nav">
                    <a href="/monitoring/">Dashboard</a>
                    <a href="/">← Back to Search</a>
                </nav>
            </div>

            <!-- Search + filter form -->
            <form class="search-form" method="GET" action="/monitoring/queries">
                <input
                    type="text"
                    name="search"
                    placeholder="Search queries…"
                    value="{% match search %}{% when Some with (s) %}{{ s }}{% when None %}{% endmatch %}"
                    autocomplete="off"
                />
                <select name="source" aria-label="Filter by source">
                    <option value="">All sources</option>
                    {% for opt in source_options %}
                    <option
                        value="{{ opt.value }}"
                        {%
                        if
                        opt.selected
                        %}
                        selected{%
                        endif
                        %}
                    >
                        {{ opt.label }}
                    </option>
                    {% endfor %}
                </select>
                <select name="type" aria-label="Filter by content type">
                    <option value="">All types</option>
                    {% for opt in content_type_options %}
                    <option
                        value="{{ opt.value }}"
                        {%
                        if
                        opt.selected
                        %}
                        selected{%
                        endif
                        %}
                    >
                        {{ opt.label }}
                    </option>
                    {% endfor %}
                </select>
                <button type="submit">Filter</button>
            </form>

            <div id="query-results">{% include "queries_partial.html" %}</div>
        </div>

        <footer>
            <p>Powered by <a href="https://corrode.dev">corrode</a></p>
        </footer>
    </body>
</html>
