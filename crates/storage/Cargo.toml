[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
types = { path = "../types" }

anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1.3"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "chrono",
    "sqlite",
] }

[dev-dependencies]
tempfile = "3.24.0"
