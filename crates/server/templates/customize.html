{# Floating "Customize" pill in the bottom-right of every page.

    The control is a button + popover (not a native <select>): on desktop the
    button shows an icon and the word "Customize"; on small viewports the
    label is hidden by CSS so only the icon remains, giving a compact
    circular tap target that doesn't fight the rest of the layout.

    Clicking the button toggles a small menu with the available themes.
    `setTheme()` is defined here as a global (function declaration) so other
    page scripts can wrap it — the stats page chains an `updateChart()` call
    after every theme change via that pattern.

    Designed to be `{% include %}`-ed once per page, just before `</body>`. #}

<div class="customize" id="customize">
    <button
        type="button"
        class="customize-toggle"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="customize-menu"
        aria-label="Customize"
        onclick="toggleCustomize()"
    >
        <svg
            class="customize-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 16 16"
            aria-hidden="true"
        >
            <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M11.5 8a3.5 3.5 0 1 1-3.464 4H1.625a.625.625 0 1 1 0-1.25h6.457A3.5 3.5 0 0 1 11.5 8Zm0 1.25a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5ZM4.5 1a3.5 3.5 0 0 1 3.464 3h6.411a.625.625 0 1 1 0 1.25H7.918A3.5 3.5 0 1 1 4.5 1Zm0 1.25a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z"
                clip-rule="evenodd"
            />
        </svg>
        <span class="customize-label">Customize</span>
    </button>

    <div
        id="customize-menu"
        class="customize-menu"
        role="menu"
        aria-label="Customize"
        hidden
    >
        <div class="customize-section">
            <div class="customize-section-title">Theme</div>
            <button type="button" role="menuitemradio" class="customize-option" data-theme="light-docs-rs"     onclick="setTheme('light-docs-rs')">docs.rs</button>
            <button type="button" role="menuitemradio" class="customize-option" data-theme="light-hacker-news" onclick="setTheme('light-hacker-news')">Hacker News</button>
            <button type="button" role="menuitemradio" class="customize-option" data-theme="dark-cathode"     onclick="setTheme('dark-cathode')">Cathode</button>
            <button type="button" role="menuitemradio" class="customize-option" data-theme="dark-twir"        onclick="setTheme('dark-twir')">This Week in Rust</button>
        </div>
    </div>
</div>

<script>
    (function () {
        // Keep in sync with the data-theme values above and the CSS theme
        // selectors in base.css. Used to defang stale localStorage values
        // from removed themes.
        const KNOWN_THEMES = [
            "light-docs-rs",
            "light-hacker-news",
            "dark-cathode",
            "dark-twir",
        ];
        const DEFAULT_THEME = "dark-cathode";

        // Global so other page scripts (e.g. stats.html's chart recolor)
        // can wrap it.
        window.setTheme = function (theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("theme", theme);
            document.querySelectorAll(".customize-option").forEach((btn) => {
                const active = btn.dataset.theme === theme;
                btn.classList.toggle("is-active", active);
                btn.setAttribute("aria-checked", active ? "true" : "false");
            });
        };

        window.toggleCustomize = function () {
            const menu = document.getElementById("customize-menu");
            const btn = document.querySelector(".customize-toggle");
            const open = !menu.hasAttribute("hidden");
            if (open) {
                menu.setAttribute("hidden", "");
                btn.setAttribute("aria-expanded", "false");
            } else {
                menu.removeAttribute("hidden");
                btn.setAttribute("aria-expanded", "true");
            }
        };

        function closeCustomize() {
            const menu = document.getElementById("customize-menu");
            const btn = document.querySelector(".customize-toggle");
            if (menu && !menu.hasAttribute("hidden")) {
                menu.setAttribute("hidden", "");
                btn.setAttribute("aria-expanded", "false");
            }
        }

        // Apply the saved theme on load. Validate against KNOWN_THEMES so a
        // stale value from a removed theme doesn't leave the page styled with
        // an unknown data-theme.
        document.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem("theme");
            const theme = KNOWN_THEMES.includes(saved) ? saved : DEFAULT_THEME;
            window.setTheme(theme);
        });

        // Close on outside click.
        document.addEventListener("click", (e) => {
            const root = document.getElementById("customize");
            if (root && !root.contains(e.target)) closeCustomize();
        });

        // Close on Escape (regardless of focus).
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeCustomize();
        });
    })();
</script>
