[package]
name = "twir"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
base64 = "0.13"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.2", features = ["serde"] }
regex = "1.10.6"
pulldown-cmark = "0.12.0"
indoc = "2.0.5"
anyhow = "1.0.86"
serde = { version = "1.0.209", features = ["derive"] }
