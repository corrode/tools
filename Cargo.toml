[workspace]
members = ["crates/*"]
default-members = ["crates/server", "crates/crawler"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
unused_results = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
get_unwrap = "deny"
index_panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"
ptr_as_ptr = "deny"
redundant_closure_for_method_calls = "deny"
cloned_instead_of_copied = "deny"
redundant_else = "deny"
semicolon_if_nothing_returned = "deny"
map_flatten = "deny"
map_identity = "deny"
exhaustive_structs = "deny"
single_match_else = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
# Only enable the tokio features we actually need (faster than "full")
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "fs"] }
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1.3"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "chrono",
    "sqlite",
    "migrate",
] }
pulldown-cmark = "0.13.1"
regex = "1.12.3"
tempfile = "3.26.0"

# Crawler
clap = { version = "4.5", features = ["derive"] }
dom_smoothie = "0.15"
headless_chrome = "1.0.21"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
scraper = "0.25"
indoc = "2.0.7"

# Server
axum = "0.8.8"
tower-http = { version = "0.6", features = ["fs"] }
askama = { version = "0.15.4" }
charming = "0.6"
strum = { version = "0.28", features = ["derive"] }

# Internal
types = { path = "crates/types" }
storage = { path = "crates/storage" }

# =============================================================================
# Profile Optimizations for Faster Compile Times
# =============================================================================

[profile.dev]
# Faster debug builds on macOS by not bundling debug info into one file
split-debuginfo = "unpacked"

# Uncomment these for larger projects where proc-macro execution is slow:
# [profile.dev.build-override]
# opt-level = 3

# Uncomment to optimize dependencies for faster runtime (increases compile time):
# [profile.dev.package."*"]
# opt-level = 1
