id = "performance"
name = "Profiling & Optimization"
description = "Measuring what's slow before (and after) you try to fix it."

intro = """
The first rule of performance work is to measure, and the right instrument
depends on the problem. Is the whole program slow, or one function? Do you need
a shareable picture or an interactive dig? Is the CPU busy, or is an async task
stalled? Reaching for a benchmark when you needed a profiler (or the reverse)
wastes a lot of time.

This stack is the measurement toolbox, end to end. The benchmarking libraries
here (criterion and divan) are dev-dependencies you add to the project, not
installed binaries.
"""

[[pick]]
tool = "cargo-flamegraph"
note = """
Start here for "where does the time go?" One `cargo flamegraph` run yields a
shareable picture of a whole execution. A good first look before you zoom in.
"""

[[pick]]
tool = "samply"
note = """
When the static picture isn't enough, `samply record` opens an interactive call
tree and timeline in the Firefox Profiler. Reach for it to explore rather than
glance.
"""

[[pick]]
tool = "criterion"
note = """
The rigorous choice for benchmarking a small function: many samples, confidence
intervals, and regression detection between runs, on stable Rust. Use it when
you need numbers you can defend. Added as a dev-dependency.
"""

[[pick]]
tool = "divan"
note = """
A lighter, faster-to-compile benchmarking library: annotate plain functions and
read a compact tree. Prefer it over criterion when you want quick, readable
numbers without the heavy statistics.
"""

[[pick]]
tool = "hyperfine"
note = "For when the unit under test is a whole command, not a function: warm-up runs, statistical timing, and A/B comparison of two binaries."

[[pick]]
tool = "cargo-show-asm"
note = "The last mile: confirm the optimization you expected (inlining, vectorization, removing bounds checks) actually shows up in the generated assembly."

[[pick]]
tool = "cargo-bloat"
note = """
Optimization and size pull in opposite directions, so keep an eye on the binary:
`cargo bloat --release --crates` shows which dependencies dominate code size
before you reach for `opt-level = "z"`, LTO, or trimming features.
"""

[[pick]]
tool = "tokio-console"
note = "Async slowness is usually a scheduling problem, not a CPU one. This surfaces stuck or busy-looping tasks that a CPU profiler can't see."
