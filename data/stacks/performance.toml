id = "performance"
name = "Profiling & Optimization"
description = "Measuring what's slow before (and after) you try to fix it."

intro = """
Performance work starts with measurement, and the right tool depends on the
problem. A profiler shows where a whole program spends its time. A benchmark
compares one function or command across runs. Async stalls may need a view of
task scheduling instead. Picking the wrong kind of measurement wastes time.

This stack is the measurement toolbox, end to end. Add the benchmarking
libraries (criterion and divan) to `[dev-dependencies]`; install the other picks
as command-line tools.
"""

[[pick]]
tool = "cargo-flamegraph"
note = """
Start here for "where does the time go?" One `cargo flamegraph` run yields a
shareable picture of a whole execution. A good first look before you zoom in.
"""

[[pick]]
tool = "samply"
note = """
When the static picture isn't enough, `samply record` opens an interactive call
tree and timeline in the Firefox Profiler. Reach for it to explore rather than
glance.
"""

[[pick]]
tool = "criterion"
note = """
Criterion benchmarks a small function with many samples, confidence intervals,
and regression detection between runs. Use it when you need numbers you can
defend. Criterion belongs in `[dev-dependencies]`.
"""

[[pick]]
tool = "divan"
note = """
Divan is a lighter benchmarking library that compiles quickly. Annotate plain
functions and read the results in a compact tree. Prefer it when you want
readable numbers without Criterion's heavier statistics.
"""

[[pick]]
tool = "hyperfine"
note = "Hyperfine benchmarks a whole command. It supports warm-up runs, statistical timing, and A/B comparison of two binaries."

[[pick]]
tool = "cargo-show-asm"
note = "Shows whether an expected optimization, such as inlining, vectorization, or removing bounds checks, appears in the generated assembly."

[[pick]]
tool = "cargo-bloat"
note = """
Optimization and size can pull in opposite directions, so keep an eye on the
binary. `cargo bloat --release --crates` shows which dependencies dominate code
size before you reach for `opt-level = "z"`, LTO, or trimming features.
"""

[[pick]]
tool = "tokio-console"
note = "Async slowness often comes from scheduling even when a CPU profile looks normal. This surfaces stuck or busy-looping tasks that an ordinary profiler can't see."
