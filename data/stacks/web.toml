id = "web"
name = "Web Frontend (WASM)"
description = "Shipping a Rust app to the browser through WebAssembly."

intro = """
Rust in the browser means compiling to `wasm32-unknown-unknown` and handing the
result to JavaScript and the DOM. Most of the tooling work is in the build
pipeline. It bundles the `.wasm`, generates the JavaScript glue, serves the app
with live reload, and keeps the result small.

This stack covers that pipeline. It deliberately leaves out the framework
(Leptos, Yew, Dioxus, …) and the backend; pick those per project. Most application
logic is plain Rust you can test on your computer. Save in-browser
`wasm-bindgen-test` runs for the parts that actually interact with the DOM.
"""

[[pick]]
tool = "trunk"
note = """
Trunk builds and serves WASM web apps from an `index.html`. It handles
`wasm-bindgen`, asset hashing, and a development server with live reload. Start
here unless you're shipping a library to npm.
"""

[[pick]]
tool = "wasm-bindgen-cli"
note = """
The glue between Rust and JavaScript or the DOM. Trunk drives it for you; you'll
invoke it directly only for custom build setups or when debugging the generated
bindings.
"""

[[pick]]
tool = "wasm-pack"
note = """
Use wasm-pack instead of Trunk when you need an npm package rather than a hosted
app. It wraps the build into something publishable to the JavaScript ecosystem
and is usually unnecessary for a self-contained Rust site.
"""
