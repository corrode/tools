id = "web"
name = "Web Frontend (WASM)"
description = "Shipping a Rust app to the browser through WebAssembly."

intro = """
Rust in the browser means compiling to `wasm32-unknown-unknown` and handing the
result to JavaScript and the DOM. The friction is rarely the UI framework. It's
the build pipeline: bundling the `.wasm`, generating the JavaScript glue,
serving with live reload, and keeping the result small.

This stack covers that pipeline. It deliberately leaves out the framework
(Leptos, Yew, Dioxus, …) and the backend; pick those per project. Most application
logic is plain Rust you can test on your computer. Save in-browser
`wasm-bindgen-test` runs for the parts that actually interact with the DOM.
"""

[[pick]]
tool = "trunk"
note = """
The build-and-serve hub for WASM web apps: point it at an `index.html`, and it
handles `wasm-bindgen`, asset hashing, and a development server with live reload.
Start here unless you're shipping a library to npm.
"""

[[pick]]
tool = "wasm-bindgen-cli"
note = """
The glue between Rust and JavaScript or the DOM. Trunk drives it for you; you'll
invoke it directly only for custom build setups or when debugging the generated
bindings.
"""

[[pick]]
tool = "wasm-pack"
note = """
Reach for this instead of Trunk when the deliverable is an npm package rather
than a hosted app: it wraps the build into something publishable to the
JavaScript ecosystem. Overkill for a self-contained Rust site.
"""
