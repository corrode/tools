id = "backend"
name = "Backend Services"
description = "Tools for long-running Rust services you deploy in a container."

intro = """
Backend services answer requests or process jobs for as long as they are running.
In Rust, that usually means an async runtime under load, a build that runs over
and over in CI and Docker, and a binary whose provenance you may have to answer
for later. The framework (axum, actix, tonic, …) is a per-project dependency;
the operational tooling around it is not.

The tools here cover the work around the service itself. They help you inspect
async tasks, avoid slow rebuilds, and record what went into the deployed binary.
Choose the framework and database separately for each project.
"""

[[pick]]
tool = "tokio-console"
note = """
A live terminal view into a running Tokio app. It shows task activity, wakeups,
and resource usage, which helps you find work that's stuck, busy-looping, or
never waking. It is for development and needs `tokio_unstable`.
"""

[[pick]]
tool = "cargo-flamegraph"
note = "When a handler is slow under load, a flamegraph gives you a visual map of where the runtime actually goes."

[[pick]]
tool = "cargo-chef"
note = """
Caches dependency compilation as a separate Docker layer, so an app-only change
doesn't rebuild the whole tree. Often the single biggest win on container build
times.
"""

[[pick]]
tool = "sccache"
note = "A shared compiler cache across local and CI builds; complements cargo-chef for the non-Docker path."

[[pick]]
tool = "cargo-deny"
note = "A policy gate on known vulnerabilities, licenses, and banned crates for everything you're about to deploy."

[[pick]]
tool = "cargo-auditable"
note = """
Embeds the exact dependency list into the binary, so a deployed artifact stays
scannable with `cargo audit bin` long after the source and lockfile are gone.
"""
