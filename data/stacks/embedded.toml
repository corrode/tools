id = "embedded"
name = "Embedded & no_std"
description = "Firmware for microcontrollers, flashed and debugged on real hardware."

intro = """
Embedded Rust puts firmware on small devices with little memory and often no
normal operating system. The libraries (HALs, `embassy` or RTIC, `defmt` for
logging) depend on the chip, so the index doesn't try to rank them. The same
host-side tooling remains useful for any target. It gets code onto the chip,
lets you watch it run, and keeps an eye on code size.

This stack is deliberately small. Most logic, such as protocol parsing and state
machines, is plain Rust you can test on your computer with `cargo-nextest` and
`bacon`. Save the slow flash-and-run cycle for code that truly needs the device.
"""

[[pick]]
tool = "probe-rs"
note = """
Probe-rs talks to a debug probe, the hardware link between your computer and
board. It can flash firmware, reset the device, stream RTT logs, and connect to
editor debuggers through `cargo embed`. Install the CLI with
`cargo install probe-rs-tools`.
"""

[[pick]]
tool = "cargo-show-asm"
note = """
On a chip with kilobytes of flash, generated machine code matters. Inspect the
assembly for a function to confirm it inlined, vectorized, or simply fits.
"""

[[pick]]
tool = "cargo-bloat"
note = """
Flash and RAM are the budget. `cargo bloat` attributes code size to crates and
functions, so when a build stops fitting you can see what grew instead of
guessing. A natural companion to the assembly view above.
"""
