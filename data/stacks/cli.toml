id = "cli"
name = "Command-Line Apps"
description = "Building and shipping a binary that other people install and run."

intro = """
A CLI's distinctive problems aren't really in the code. They're at the edges:
testing the help text and errors people actually see, and getting the binary
onto other people's machines across three operating systems without asking them
to install a Rust toolchain first.

This stack covers building, testing, and distributing a binary. It leaves the
argument parser and TUI libraries (clap, ratatui, …) to the project. Those are
dependencies, not tooling.
"""

[[pick]]
tool = "cargo-dist"
note = """
The headline pick: builds binaries for Linux, macOS, and Windows, creates
shell/PowerShell/Homebrew installers, and wires up release CI to produce them on
a version tag. Once the binaries reach GitHub Releases, users can
`cargo binstall your-tool` and skip the compile entirely. (Now continuing under
the name `dist`.)
"""

[[pick]]
tool = "insta"
note = """
Records your CLI's real output (`--help`, error messages, formatted tables) and
shows a diff when it changes. `cargo insta review` makes accepting intentional
changes painless. Added as a dev-dependency.
"""

[[pick]]
tool = "just"
note = """
A `justfile` captures your build/lint/release incantations as named recipes, so
contributors run `just release` instead of memorizing flags. Lighter than a
Makefile and Rust-friendly.
"""
