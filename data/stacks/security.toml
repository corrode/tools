id = "security"
name = "Security & Supply Chain"
description = "Knowing and controlling what's actually in your dependency tree."

intro = """
Most of a Rust project's code comes from direct and indirect dependencies.
Checking that code involves several steps. You can scan for known
vulnerabilities, enforce rules for licenses and download sources, record human
reviews, and keep deployed binaries auditable after the fact.

Start with cargo-audit and add the other tools when the project needs stricter
policy or more detailed review.
"""

[[pick]]
tool = "cargo-audit"
note = """
Cargo-audit checks your lockfile against the RustSec advisory database. It is
cheap, fast, and worth running in CI from the start of a project.
"""

[[pick]]
tool = "cargo-deny"
note = """
Cargo-deny adds policy checks for known vulnerabilities, licenses, banned and
duplicate crates, and permitted sources. Configure them in `deny.toml` when a
vulnerability scan alone is not enough.
"""

[[pick]]
tool = "cargo-vet"
note = """
Cargo-vet records which dependencies people have reviewed and shares those
audits across a team. This process is usually unnecessary for a solo project,
but some organizations require it. Its focus is human judgment; cargo-audit
handles advisories.
"""

[[pick]]
tool = "cargo-auditable"
note = """
Embeds the dependency list into release binaries so they can be scanned with
`cargo audit bin` later, even without the source or lockfile. Provenance for
what you actually shipped.
"""

[[pick]]
tool = "cargo-geiger"
note = """
Counts `unsafe` usage across the dependency tree, for projects that want to
minimize code where the compiler can't enforce every memory-safety rule. Treat
it as a heuristic, not a verdict, and confirm it builds on current toolchains
before trusting it in CI.
"""

[[pick]]
tool = "cargo-machete"
note = "Finds unused dependencies quickly enough to run in CI. Removing them leaves less third-party code to review and maintain."
