id = "testing"
name = "Testing & Correctness"
description = "Proving the code does what you think, beyond a handful of examples."

intro = """
Rust's built-in `#[test]` support runs functions and checks assertions. Everything
past that, such as repeating cases, faking a dependency, generating inputs,
locking down large outputs, or measuring what the suite exercises, is left to
the ecosystem. The right tool depends on the question you're asking.

This stack is the correctness toolbox, from everyday conveniences to specialist
instruments. It stays focused on *does it behave*, not *how fast*. `cargo-nextest`
from the Everyday Essentials runs these tests (but skips doctests, so keep
`cargo test --doc` alongside it). The generated-input and mocking libraries are
dev-dependencies you add to the project, not installed binaries.
"""

[[pick]]
tool = "rstest"
note = """
Cuts the copy-paste out of running one test with many inputs: `#[case(...)]` rows
and `#[values(...)]` matrices expand into individually named tests, while
`#[fixture]` provides reusable setup.
"""

[[pick]]
tool = "proptest"
note = """
When examples aren't enough, check rules over generated inputs and let proptest
shrink any failure to a minimal, saved counterexample. Strongest on parsers,
encoders, and anything that converts data out and back. Added as a
dev-dependency.
"""

[[pick]]
tool = "insta"
note = """
Snapshot testing for large or structured output (debug, JSON, YAML, RON): record
once, then fail on change and `cargo insta review` the diff. Skip it for small
values where a plain `assert_eq!` reads better.
"""

[[pick]]
tool = "mockall"
note = """
Fakes external seams (network, clock, filesystem) so logic can be tested without
the real dependency. Pays off when your code already abstracts over traits; if
it doesn't, a hand-written fake is often clearer than the macro machinery. A
dev-dependency.
"""

[[pick]]
tool = "cargo-llvm-cov"
note = """
The first measure of suite quality: accurate coverage showing which source lines
actually ran. Publish it or gate on it so coverage is visible rather than
assumed. Integrates with nextest.
"""

[[pick]]
tool = "cargo-mutants"
note = """
The second, deeper measure: it makes small changes to your code and reruns the
tests, exposing assertions that don't truly pin behavior and gaps coverage can't
see. It's slow, so scope it to changed files in CI rather than the whole tree.
"""

[[pick]]
tool = "loom"
note = """
The specialist: explores thread interleavings and memory orderings to find races
in lock-free code. Reach for it only if you write your own synchronization
primitives; for everyday `async` and channels it's overkill. A dev-dependency.
"""
