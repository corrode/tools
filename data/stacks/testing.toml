id = "testing"
name = "Testing & Correctness"
description = "Proving the code does what you think, beyond a handful of examples."

intro = """
Rust's built-in `#[test]` support runs functions and checks assertions. Everything
past that, such as repeating cases, faking a dependency, generating inputs,
locking down large outputs, or measuring what the suite exercises, is left to
the ecosystem. The right tool depends on the question you're asking.

The tools here focus on behavior and correctness. Performance measurements live
in the Profiling & Optimization stack. `cargo-nextest` from the Everyday
Essentials runs these tests, but skips doctests, so keep `cargo test --doc`
alongside it. Add the generated-input and mocking libraries to
`[dev-dependencies]`; install the `cargo-*` tools separately.
"""

[[pick]]
tool = "rstest"
note = """
Cuts the copy-paste out of running one test with many inputs. `#[case(...)]` rows
and `#[values(...)]` matrices expand into individually named tests, while
`#[fixture]` provides reusable setup.
"""

[[pick]]
tool = "proptest"
note = """
When examples aren't enough, check rules over generated inputs and let proptest
shrink any failure to a minimal, saved counterexample. Strongest on parsers,
encoders, and anything that converts data out and back. Added as a
dev-dependency.
"""

[[pick]]
tool = "insta"
note = """
Records large or structured output such as debug text, JSON, YAML, or RON. Later
test runs fail on changes and `cargo insta review` shows the diff. For small
values, a plain `assert_eq!` usually reads better.
"""

[[pick]]
tool = "mockall"
note = """
Fakes external seams (network, clock, filesystem) so logic can be tested without
the real dependency. Pays off when your code already abstracts over traits; if
it doesn't, a hand-written fake is often clearer than the macro machinery. A
dev-dependency.
"""

[[pick]]
tool = "cargo-llvm-cov"
note = """
Shows which source lines actually ran during the tests. Publish the report or
gate on it so coverage remains visible. It integrates with nextest.
"""

[[pick]]
tool = "cargo-mutants"
note = """
Makes small changes to your code and reruns the tests. If they still pass, they
may not be checking the changed behavior. This can reveal gaps that coverage
alone misses. It is slow, so scope it to changed files in CI rather than the
whole tree.
"""

[[pick]]
tool = "loom"
note = """
Explores thread interleavings and memory orderings to find races in lock-free
code. Use it only if you write your own synchronization primitives; everyday
`async` code and channels rarely need it. Add it under `[dev-dependencies]`.
"""
