id = "library"
name = "Publishing a Library"
description = "Shipping a crate to crates.io and keeping its API honest over time."

intro = """
Publishing a library shifts the hard problems from "does it work" to "will this
release break someone." That means watching the public API, the functions and
types users call, for accidental semver breaks; keeping changelogs and version
bumps honest; and making sure what you ship is lean and license-clean.

This stack keeps releases and API changes honest. `rustdoc` already generates
the API reference from code comments, so it isn't listed; mdBook covers the
tutorials and longer explanations that don't fit there.
"""

[[pick]]
tool = "cargo-semver-checks"
note = """
Scans your public API against the last published release and flags breaking
changes before you tag one. The single most valuable check a library can add to
CI.
"""

[[pick]]
tool = "release-plz"
note = """
A hands-off, PR-based release flow: it derives version bumps and changelog
entries from your commits and publishes on merge. Start here unless you want to
drive releases by hand.
"""

[[pick]]
tool = "cargo-release"
note = """
The manual counterpart to release-plz: explicit, command-driven version bump,
tag, and publish. Reach for it when you'd rather run each release step yourself
than hand it to a bot.
"""

[[pick]]
tool = "cargo-deny"
note = """
Gate CI on known vulnerabilities, license policy, and banned or duplicate
crates. It matters more for a library, whose dependency choices become its
users' dependency choices.
"""

[[pick]]
tool = "cargo-machete"
note = "Catches dependencies you declared but no longer use, so users don't compile dead weight. Fast enough for a CI gate."

[[pick]]
tool = "proptest"
note = """
Property tests check rules that should hold across many generated inputs, not
just a handful of examples. When one fails, proptest shrinks it to a small,
saved counterexample. Added as a dev-dependency, not installed.
"""

[[pick]]
tool = "mdbook"
note = """
For the narrative guide rustdoc can't give you: tutorials, concepts, worked
examples. Optional, but often the difference between a crate people adopt and
one they bounce off.
"""
