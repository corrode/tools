id = "proptest"
name = "proptest"
repository = "https://github.com/proptest-rs/proptest"
category = "testing"
crate = "proptest"
installable = false

remarks = """
A property-based testing library: instead of hand-writing example inputs, you
describe properties that should hold for all inputs and let `proptest` generate
many cases. When a case fails it automatically shrinks the input to a minimal
failing example and persists it to a regression file so failures stay
reproducible.

Its `Strategy`-based generators compose well for structured and constrained
data, going beyond simple type-driven generation. Compared to `quickcheck`,
it is more flexible but more verbose; reach for `quickcheck` when you want a
lighter, type-directed approach.
"""

alternatives = ["quickcheck"]

