category = "linting"
crate = "cargo-semver-checks"

remarks = """
Lints a crate's public API for SemVer-violating changes between releases,
catching breaking changes that would require a major version bump.

Run `cargo semver-checks` before publishing to verify your version bump matches
the actual API surface. It analyzes the API for breakage but cannot detect
behavioral or semantic changes, so it complements rather than replaces tests.
"""

