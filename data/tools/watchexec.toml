id = "watchexec"
name = "watchexec"
repository = "https://github.com/watchexec/watchexec"
category = "productivity"
crate = "watchexec-cli"

remarks = """
A general-purpose, language-agnostic file watcher that runs an arbitrary command
whenever matching files change, with debouncing, glob filters, and process
restart handling. Installed via the `watchexec-cli` crate.

Use it to drive any tool on change (tests, builds, codegen, server reloads),
regardless of language. For a Rust-specific experience with a results TUI and
ready-made `cargo` jobs, `bacon` is more convenient.
"""

alternatives = ["bacon", "cargo-watch (deprecated)"]

