id = "cargo-fuzz"
name = "cargo-fuzz"
repository = "https://github.com/rust-fuzz/cargo-fuzz"
category = "testing"
crate = "cargo-fuzz"

remarks = """
Scaffolds and drives coverage-guided fuzzing targets backed by libFuzzer. You
write a `fuzz_target!` that feeds arbitrary bytes into your code, and
`cargo fuzz run` mutates inputs to maximize coverage and surface panics, memory
errors, and crashes, saving any reproducer it finds.

It links libFuzzer through the compiler's sanitizer support and therefore
requires a nightly toolchain. For an AFL-style engine instead, see the `afl`
crate (cargo-afl). Fuzzing complements, rather than replaces, unit and
property tests.
"""

alternatives = ["cargo-afl"]

