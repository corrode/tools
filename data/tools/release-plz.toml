id = "release-plz"
name = "release-plz"
repository = "https://github.com/release-plz/release-plz"
category = "release"
crate = "release-plz"

remarks = """
Automates releases for cargo workspaces through pull requests: it derives version
bumps and changelog entries from conventional commits, opens a release PR, and
publishes to crates.io once merged. Designed to run in CI.

Use it for a hands-off, git-driven release flow across many crates. If you want
manual, step-by-step control from your terminal instead, use the lower-level
`cargo-release`; it internally relies on `git-cliff`-style changelog generation.
"""

alternatives = ["cargo-release", "git-cliff"]
recommended = true

