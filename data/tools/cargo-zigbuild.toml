id = "cargo-zigbuild"
name = "cargo-zigbuild"
repository = "https://github.com/rust-cross/cargo-zigbuild"
category = "cross-platform"
crate = "cargo-zigbuild"

remarks = """
Cross compiles by using `zig cc` as the linker, which makes it easy to target a
specific older glibc version (e.g. `--target x86_64-unknown-linux-gnu.2.17`) for
broad binary compatibility, all without containers.

Use it for lightweight, container-free cross builds, especially for glibc version
targeting. It requires Zig to be installed and does not cover every exotic target
or runtime; for those, `cross` with its prebuilt images may be more reliable.
"""

alternatives = ["cross"]

