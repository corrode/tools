id = "cargo-llvm-cov"
name = "cargo-llvm-cov"
repository = "https://github.com/taiki-e/cargo-llvm-cov"
category = "testing"
crate = "cargo-llvm-cov"

remarks = """
Collects source-based code coverage using LLVM's instrumentation
(`-C instrument-coverage`), giving accurate line and region coverage that maps
back to your source. It handles the gcov/profdata plumbing for you and can emit
lcov, HTML, or Cobertura reports, and integrates with `cargo nextest`.

It works across the major platforms Rust's LLVM coverage supports and is the
current go-to for accurate coverage. It needs the `llvm-tools-preview` rustup
component; the older `cargo-tarpaulin` is an alternative with different platform
tradeoffs.
"""

alternatives = ["cargo-tarpaulin"]
related = ["cargo-mutants"]

