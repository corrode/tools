id = "taplo"
name = "taplo"
repository = "https://github.com/tamasfe/taplo"
category = "formatting"
crate = "taplo-cli"

remarks = """
A TOML toolkit providing a formatter, linter, and language server for TOML files
such as `Cargo.toml` and `rustfmt.toml`.

Install with the `taplo-cli` crate and run `taplo fmt` or `taplo lint`; use
`taplo fmt --check` in CI. Reach for it to keep config files tidy and validated
against schemas. It handles TOML only, so pair it with `rustfmt` for Rust source.
"""

alternatives = ["rustfmt"]

