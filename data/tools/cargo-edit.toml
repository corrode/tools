id = "cargo-edit"
name = "cargo-edit"
repository = "https://github.com/killercup/cargo-edit"
category = "cargo-extensions"
crate = "cargo-edit"

remarks = """
Adds dependency-editing subcommands to Cargo. `cargo add` and `cargo rm` are
now built into Cargo itself, but cargo-edit still provides `cargo upgrade`
(bump dependencies in `Cargo.toml` to the latest compatible, or `--incompatible`,
versions) and `cargo set-version`.

Mostly you only need it today for `cargo upgrade`. If you just want to add or
remove a dependency, use the built-in `cargo add`/`cargo remove` and skip this.
"""

alternatives = ["cargo add (built-in)", "cargo-upgrades", "cargo-set-version"]

