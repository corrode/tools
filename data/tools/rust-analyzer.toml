id = "rust-analyzer"
name = "rust-analyzer"
repository = "https://github.com/rust-lang/rust-analyzer"
category = "productivity"

remarks = """
The official Language Server Protocol implementation for Rust, powering IDE
features like completion, go-to-definition, inline type hints, refactorings, and
on-the-fly diagnostics in editors such as VS Code, Zed, and Neovim.

It is the default choice for editor integration and is distributed as a `rustup`
component or an editor extension rather than an installable crate. It is an
interactive analysis server, not a CI checker; for command-line checks use
`cargo check`/`clippy`, and for an automated check loop use `bacon`.
"""

alternatives = ["bacon"]

