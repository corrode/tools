id = "insta"
name = "insta"
repository = "https://github.com/mitsuhiko/insta"
category = "testing"
crate = "insta"
installable = false

remarks = """
A snapshot testing library that records the output of a value (debug, JSON,
YAML, RON, or plain strings) to a file and fails when it later changes. This is
ideal for asserting on large or structured outputs where writing explicit
expected values by hand is tedious.

Its companion `cargo-insta` adds `cargo insta review` for interactively
accepting or rejecting diffs, plus inline snapshots embedded in source. Use it
for serialization, parser, and rendering output; for small scalar assertions a
plain `assert_eq!` is clearer and avoids a separate review step.
"""

alternatives = []
related = ["rstest"]

