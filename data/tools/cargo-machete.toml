id = "cargo-machete"
name = "cargo-machete"
repository = "https://github.com/bnjbvr/cargo-machete"
category = "dependencies"
crate = "cargo-machete"

remarks = """
Finds dependencies declared in `Cargo.toml` that are never used, by scanning
source files for references to each crate. It runs on stable Rust without
compiling the project, which makes it fast enough for CI gates and large
workspaces.

Because the analysis is heuristic (text-based), it can produce false positives
for crates used only via macros or re-exports; mark those with
`ignored = [...]` under `[package.metadata.cargo-machete]`. For a precise but
slower, nightly-only check, use `cargo-udeps`.
"""

alternatives = ["cargo-udeps"]

