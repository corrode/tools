remarks = """
A statistics-driven microbenchmarking library for in-process Rust functions. It
collects many samples, estimates confidence intervals, and detects performance
regressions between runs, all on stable Rust.

Prefer it over the unstable built-in `#[bench]` harness when you need reliable
numbers without nightly. If you want a lighter, faster-to-compile alternative
look at `divan`; to benchmark whole commands rather than functions use
`hyperfine`.
"""

