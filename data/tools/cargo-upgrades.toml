id = "cargo-upgrades"
name = "cargo-upgrades"
repository = "https://gitlab.com/kornelski/cargo-upgrades"
category = "dependencies"
crate = "cargo-upgrades"

remarks = """
Checks which dependencies can be upgraded to newer SemVer-incompatible
versions, accounting for the whole dependency graph so it only suggests
upgrades that can actually resolve. This avoids the false positives you get
from naively comparing against the latest crates.io release.

Use it as a sanity check before bumping version requirements. It reports only;
pair it with `cargo upgrade` from cargo-edit to apply changes. Overlaps heavily
with `cargo-outdated`, so most projects need just one.
"""

alternatives = ["cargo-outdated", "cargo-edit"]

