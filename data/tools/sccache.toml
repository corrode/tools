id = "sccache"
name = "sccache"
repository = "https://github.com/mozilla/sccache"
category = "build"
crate = "sccache"

remarks = """
A compiler cache (think `ccache` for Rust) that caches compilation artifacts
locally or in shared storage (S3, GCS, Redis, memcached). Set it as your
`RUSTC_WRAPPER` to share build outputs across branches, machines, and CI runs.

Big wins on CI and large teams. Less useful for a single dev with a warm local
`target/` (incremental compilation already covers you), and shared caches add
network/storage setup you may not want for small projects.
"""

alternatives = ["Cargo incremental compilation", "cargo-chef (Docker layer caching)"]
related = ["cargo-wizard"]

