id = "rustfmt"
name = "rustfmt"
repository = "https://github.com/rust-lang/rustfmt"
category = "formatting"

remarks = """
The official Rust code formatter, applying a consistent style across a codebase
so diffs stay focused on real changes rather than whitespace.

Installed as a rustup component with `rustup component add rustfmt` and run via
`cargo fmt`. Use `cargo fmt --check` in CI to enforce formatting without writing
files. It formats Rust source only; use `taplo` for `Cargo.toml` and other TOML.
"""

alternatives = ["taplo"]
recommended = true

