id = "cargo-audit"
name = "cargo-audit"
repository = "https://github.com/rustsec/rustsec"
category = "security"
crate = "cargo-audit"

remarks = """
Scans `Cargo.lock` for dependencies with known vulnerabilities reported in the
RustSec advisory database.

Run `cargo audit` in CI to fail builds when a vulnerable or yanked crate enters
the dependency tree. It checks advisories only; for license, source, and
duplicate-crate policy use `cargo-deny`, which subsumes this functionality.
"""

alternatives = ["cargo-deny", "cargo-vet"]
related = ["cargo-auditable"]
recommended = true

