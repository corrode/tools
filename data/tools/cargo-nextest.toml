id = "cargo-nextest"
name = "cargo-nextest"
repository = "https://github.com/nextest-rs/nextest"
category = "testing"
crate = "cargo-nextest"

remarks = """
A next-generation test runner that executes each test in its own process for
isolation, runs them in parallel with a clean summary output, and is typically
faster than `cargo test` on larger suites. It adds practical features like
automatic retries for flaky tests, per-test timeouts, and JUnit output for CI.

Run it with `cargo nextest run`. Note it does not run doctests, so you still
need `cargo test --doc` for those. Tests that assume they share a process (for
example relying on global state set by another test) may need adjustment under
its process-per-test model.
"""

alternatives = ["cargo test (built-in)"]
related = ["cargo-mutants"]
recommended = true

