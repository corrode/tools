id = "cargo-tree"
name = "cargo-tree"
repository = "https://github.com/sfackler/cargo-tree"
category = "dependencies"
crate = "cargo-tree"

remarks = """
ARCHIVED. This standalone subcommand visualized the dependency graph as a tree
and helped track down where a transitive crate or duplicate version came from.
Its functionality was upstreamed into Cargo itself starting with Rust 1.44.

Do not install this crate anymore: run the built-in `cargo tree` instead, which
is maintained, supports `-i`/`--invert` to find who pulls in a package, and
`-d` to show duplicate versions. The external repository is no longer
developed.
"""

