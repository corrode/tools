category = "productivity"
crate = "evcxr_repl"

remarks = """
Provides interactive Rust evaluation: `evcxr_repl` is a REPL where you can define
items, add dependencies with `:dep`, and evaluate expressions incrementally, and
the same engine backs a Jupyter kernel for notebooks.

Use it for experimentation, learning, and prototyping snippets without a full
crate. It recompiles behind the scenes so it is not a performance-measurement
tool; for benchmarking use `criterion` or `hyperfine`.
"""

