category = "linting"

remarks = """
The official Rust linter, providing 700+ lints that catch correctness issues,
performance pitfalls, and unidiomatic code beyond what `rustc` reports.

Installed as a rustup component with `rustup component add clippy` and run via
`cargo clippy`. Effectively mandatory in CI as `cargo clippy -- -D warnings` to
fail the build on any lint. Not a formatter; pair it with `rustfmt` for style.
"""

