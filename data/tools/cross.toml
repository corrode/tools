id = "cross"
name = "cross"
repository = "https://github.com/cross-rs/cross"
category = "cross-platform"
crate = "cross"

remarks = """
Zero-setup cross compilation: `cross build --target ...` runs the build inside
prebuilt Docker/Podman images that already contain the right toolchain, linker,
and system libraries for the target.

Use it to target architectures and platforms without manually installing cross
linkers. It requires a running container engine (Docker or Podman), which can be
a dealbreaker in restricted CI; if you only need different glibc versions or want
to avoid containers, consider `cargo-zigbuild`.
"""

alternatives = ["cargo-zigbuild"]
recommended = true

