id = "cargo-dist"
name = "cargo-dist"
repository = "https://github.com/axodotdev/cargo-dist"
category = "release"
crate = "cargo-dist"

remarks = """
Builds and packages cross-platform binary artifacts and installers (shell/PowerShell
installers, archives, npm/Homebrew formulae) and wires up the CI to produce them
on a tagged release.

Use it when you ship prebuilt binaries rather than just publishing a crate. Note
the project has been renamed to `dist`; newer releases and docs live under that
name. It handles distribution, not version bumping, so pair it with
`cargo-release` or `release-plz`.
"""

alternatives = ["release-plz", "cargo-release"]

