name = "git-cliff"
repository = "https://github.com/orhun/git-cliff"
category = "release"
crate = "git-cliff"

remarks = """
A highly customizable changelog generator that builds release notes from git
history, with first-class support for conventional commits and fully templated
output (via Tera) and regex-based commit grouping.

Use it when you want full control over changelog formatting independent of your
release tooling. It only produces the changelog; to drive the actual version
bump, tag, and publish use `cargo-release` or `release-plz`.
"""

alternatives = ["release-plz", "cargo-release"]

