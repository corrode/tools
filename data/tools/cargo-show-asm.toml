id = "cargo-show-asm"
name = "cargo-show-asm"
repository = "https://github.com/pacak/cargo-show-asm"
category = "debugging"
crate = "cargo-show-asm"

remarks = """
Shows the assembly, LLVM IR, MIR, or WASM the compiler generates for a chosen
function via `cargo asm`. Lets you confirm that optimizations (inlining,
vectorization, bounds-check elimination) actually happened.

Use it when you need to inspect codegen at the instruction level for a specific
function. To see source after macro expansion instead use `cargo-expand`, and to
profile real runtime behavior use `samply` or `cargo-flamegraph`.
"""

alternatives = ["cargo-expand"]
related = ["cargo-bloat"]

