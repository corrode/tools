id = "just"
name = "just"
repository = "https://github.com/casey/just"
category = "productivity"
crate = "just"

remarks = """
A command runner that saves project-specific commands as recipes in a `justfile`
and runs them with `just <recipe>`. Think of it as a saner `make`: recipes,
parameters, and dependencies without make's reliance on file timestamps and
tab-sensitive syntax.

Use it to standardize common project tasks (build, test, lint, deploy) for a
team. It is a task runner, not a build system, so it does not do incremental
builds based on file changes; for that keep using `cargo` or `make`.
"""

alternatives = ["make", "cargo-make"]

