id = "hotpath"
name = "hotpath"
repository = "https://github.com/pawurb/hotpath-rs"
category = "performance"
crate = "hotpath"
installable = false

remarks = """
An instrumentation-based profiler: annotate hot functions with
`#[hotpath::measure]`, add `#[hotpath::main]` to your entry point, and run with
the `hotpath` feature to get a per-function table of timing, memory allocations,
and CPU usage. Everything is gated behind a feature flag, so it compiles to a
no-op when disabled. A live TUI dashboard, async channel/stream/future
instrumentation, and an MCP server for querying results from an LLM round out
the package.

Reach for it when you want low-overhead, targeted numbers on functions you
already suspect, especially in async code where it separates time spent waiting
on I/O from time burning CPU. Because it only measures what you annotate, it
won't reveal hot spots in code you didn't mark; for unguided, whole-process
sampling reach for `samply` or `cargo-flamegraph`, and for rigorous statistical
benchmarking of a single function use `criterion`.
"""

alternatives = ["samply", "cargo-flamegraph"]
related = ["tokio-console"]
added = "2026-06-04"

