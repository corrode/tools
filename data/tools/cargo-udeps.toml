id = "cargo-udeps"
name = "cargo-udeps"
repository = "https://github.com/est31/cargo-udeps"
category = "dependencies"
crate = "cargo-udeps"

remarks = """
Finds unused dependencies by inspecting actual compiler output, so it knows
which crates were actually linked rather than guessing from source text. This
makes it more accurate than heuristic scanners, catching cases that pure text
analysis misses and avoiding some false positives.

The tradeoff is that it requires a nightly toolchain and a full build, so it is
slower. If you want a stable, fast check for everyday CI, prefer
`cargo-machete` and keep `cargo-udeps` for periodic deep audits.
"""

alternatives = ["cargo-machete"]
recommended = true

