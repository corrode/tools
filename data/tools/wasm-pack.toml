repository = "https://github.com/rustwasm/wasm-pack"
category = "wasm"
crate = "wasm-pack"

remarks = """
Builds Rust-generated WebAssembly for consumption from JavaScript, producing an
npm-ready package with the `wasm-bindgen` glue, TypeScript types, and a
`package.json`.

Use it when you publish a Rust library to npm or integrate WASM into a JS
toolchain. Note its maintenance activity has slowed; for a full Rust frontend app
prefer `trunk`, and for a thinner build step you can invoke `wasm-bindgen-cli`
directly.
"""

alternatives = ["trunk", "wasm-bindgen-cli"]

