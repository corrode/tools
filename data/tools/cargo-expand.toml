id = "cargo-expand"
name = "cargo-expand"
repository = "https://github.com/dtolnay/cargo-expand"
category = "debugging"
crate = "cargo-expand"

remarks = """
Prints the source of your crate after macro expansion, so you can see exactly
what `derive`, `macro_rules!`, and proc-macros generate. Invaluable for
debugging macros and understanding surprising compiler errors.

It shells out to the compiler's expansion mode, which requires a nightly `rustc`
to run (`rustup toolchain install nightly`), even if your project otherwise uses
stable. Not a code generator: it only shows expansion, it does not modify your
sources.
"""

alternatives = ["cargo-show-asm"]
recommended = true

