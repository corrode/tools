id = "cargo-tarpaulin"
name = "cargo-tarpaulin"
repository = "https://github.com/xd009642/tarpaulin"
category = "testing"
crate = "cargo-tarpaulin"

remarks = """
A code coverage tool for Rust that reports line coverage and uploads cleanly to
services like Codecov and Coveralls. It was the long-standing default for CI
coverage and remains widely used and simple to invoke with `cargo tarpaulin`.

Its mature Ptrace-based engine is Linux/x86_64-focused, though it now also
offers an LLVM-based backend. If you need accurate source-based coverage across
more platforms, `cargo-llvm-cov` is generally the better fit today.
"""

alternatives = ["cargo-llvm-cov"]

