id = "tokio-console"
name = "tokio-console"
repository = "https://github.com/tokio-rs/console"
category = "debugging"
crate = "tokio-console"

remarks = """
A diagnostics and debugging TUI for async Rust. It connects to a running
`tokio` app (via the `console-subscriber` instrumentation) and shows live
per-task state, poll times, wakers, and resource usage, making it possible to
spot tasks that are stuck, busy-looping, or never waking.

Indispensable for diagnosing async stalls and runaway tasks. It requires adding
the subscriber and building with `tokio_unstable`, so it's a development-time
tool, not something you ship. For CPU/wall-clock hotspots in sync code, reach
for a sampling profiler like `samply` instead.
"""

alternatives = ["samply", "cargo-flamegraph"]
related = ["loom"]
recommended = true

