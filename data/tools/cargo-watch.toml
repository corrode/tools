name = "cargo-watch"
repository = "https://github.com/watchexec/cargo-watch"
category = "cargo-extensions"
crate = "cargo-watch"

remarks = """
Watches your source tree and re-runs a cargo command (`check`, `test`, `run`)
on every change. It was the de-facto Rust file-watcher for years.

Deprecated: the project is archived and no longer maintained. For a Rust-aware
watch loop with a clean rendered TUI use **bacon**; for a general-purpose,
language-agnostic watcher use **watchexec** (which now absorbs cargo-watch's
maintainers). Don't start new projects on cargo-watch.
"""

successors = ["bacon", "watchexec"]
alternatives = ["bacon", "watchexec"]

