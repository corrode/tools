id = "cargo-mutants"
name = "cargo-mutants"
repository = "https://github.com/sourcefrog/cargo-mutants"
category = "testing"
crate = "cargo-mutants"

remarks = """
Mutation testing for Rust: it injects small changes — a `>` becomes `>=`, a
function returns `Default::default()` — and reruns your tests, reporting any
mutant that survives as a gap in your suite. Where line coverage only proves
code was *executed*, surviving mutants show where your assertions don't actually
*pin down* behavior.

It's CPU-hungry: every mutant is a fresh build-and-test cycle, so scope it to
changed files or specific modules in CI rather than re-running the whole tree.
It pairs naturally with `cargo-nextest` as the runner and complements
`cargo-llvm-cov` — use coverage to find untested lines, mutants to find
under-tested ones.
"""

related = ["cargo-nextest", "cargo-llvm-cov"]
recommended = true
added = "2026-06-04"
