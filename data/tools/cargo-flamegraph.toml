id = "cargo-flamegraph"
name = "cargo-flamegraph"
repository = "https://github.com/flamegraph-rs/flamegraph"
category = "performance"
crate = "flamegraph"

remarks = """
Generates flamegraphs from a single `cargo flamegraph` invocation, wrapping
`perf` on Linux and `dtrace` on macOS/Windows to sample stacks and render an
interactive SVG.

Reach for it when you need a quick visual of where wall-clock time goes across a
whole binary. It profiles a complete run, so for fine-grained, statistically
sound timing of individual functions use `criterion` instead, and for an
interactive UI consider `samply`.
"""

alternatives = ["samply", "perf"]

