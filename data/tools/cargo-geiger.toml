id = "cargo-geiger"
name = "cargo-geiger"
repository = "https://github.com/geiger-rs/cargo-geiger"
category = "security"
crate = "cargo-geiger"

remarks = """
Audits your dependency tree for `unsafe` code, reporting how many unsafe
expressions each crate contains so you can gauge how much of your supply chain
relies on it. Useful for security reviews and for projects that aim to minimize
unsafe surface area.

Treat the counts as a heuristic, not a verdict: `unsafe` is not inherently a
bug, and the tool can struggle with some macro-heavy crates. Note its
maintenance has been intermittent. Verify it builds against current toolchains
before relying on it in CI.
"""

alternatives = ["cargo-audit", "cargo-deny"]
recommended = true

