id = "cargo-make"
name = "cargo-make"
repository = "https://github.com/sagiegurari/cargo-make"
category = "productivity"
crate = "cargo-make"

remarks = """
A task runner and build tool configured through a `Makefile.toml`, with
cross-platform tasks, dependencies between tasks, conditions, and a large set
of predefined tasks for common cargo workflows.

Choose it when you want a batteries-included, cargo-native task system that
encodes complex pipelines in one file. If you only need a simple, language
agnostic command launcher, `just` is lighter and quicker to learn.
"""

alternatives = ["just", "make"]
