id = "cargo-outdated"
name = "cargo-outdated"
repository = "https://github.com/kbknapp/cargo-outdated"
category = "dependencies"
crate = "cargo-outdated"

remarks = """
Displays a table of dependencies that have newer versions available, comparing
what is resolved in `Cargo.lock` against the latest releases on crates.io. It
distinguishes between updates allowed by your current version requirements and
those that need a manual `Cargo.toml` bump (SemVer-incompatible).

Run `cargo outdated -R` to limit the report to root dependencies. It only
reports and never edits your manifest, so reach for `cargo upgrade` (from
cargo-edit) when you actually want to apply the bumps.
"""

alternatives = ["cargo-upgrades", "cargo-edit"]

