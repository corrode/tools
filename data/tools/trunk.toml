id = "trunk"
name = "trunk"
repository = "https://github.com/trunk-rs/trunk"
category = "cross-platform"
crate = "trunk"

remarks = """
A WASM web application bundler for Rust frontend frameworks like Yew and Leptos.
Driven by a `Trunk.toml` and `index.html`, it runs the asset pipeline (SCSS,
images, JS snippets), builds the WASM, and serves a hot-reloading dev server.

Reach for it to build and ship a Rust single-page app to the browser. If your
goal is instead to produce a WASM package consumed from JavaScript/npm, use
`wasm-pack` or `wasm-bindgen-cli` directly.
"""

alternatives = ["wasm-pack", "wasm-bindgen-cli"]

