id = "samply"
name = "samply"
repository = "https://github.com/mstange/samply"
category = "performance"
crate = "samply"

remarks = """
A cross-platform sampling profiler: `samply record <cmd>` captures a profile and
opens it in the Firefox Profiler web UI, giving you a call tree, stack charts,
and timeline without leaving the browser.

Good when you want interactive exploration of where time is spent across a whole
process. For a static, shareable SVG instead use `cargo-flamegraph`, and for
precise per-function timing use `criterion`.
"""

alternatives = ["cargo-flamegraph", "perf"]

