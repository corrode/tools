id = "probe-rs"
name = "probe-rs"
repository = "https://github.com/probe-rs/probe-rs"
category = "cross-platform"
# The crates.io `probe-rs` crate (tracked for metrics) is a library; the CLI
# ships as `probe-rs-tools`, so keep it out of derived `cargo install` lines.
installable = false
crate = "probe-rs"

remarks = """
A toolkit for debugging and flashing embedded Rust on real hardware. It talks
to debug probes (CMSIS-DAP, J-Link, ST-Link) to flash firmware, reset targets,
and run an in-app log/RTT console, and ships `cargo embed` plus a GDB/DAP
server for editor debugging. It's the modern replacement for OpenOCD-based
workflows in the embedded Rust ecosystem.

Reach for it whenever you develop firmware for microcontrollers. It's irrelevant
for hosted (non-embedded) targets, and very capable probes with vendor-specific
features may still need their proprietary tooling.
"""

alternatives = ["OpenOCD", "cargo-flash", "cargo-embed"]
recommended = true

