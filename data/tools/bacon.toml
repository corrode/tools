name = "bacon"
repository = "https://github.com/Canop/bacon"
category = "productivity"
crate = "bacon"

remarks = """
A background Rust code checker that re-runs `cargo check`, `clippy`, `test`, or
`doc` whenever you save and shows warnings and errors in a compact, navigable
TUI, jumping straight to the first problem.

Use it for a fast, terminal-based feedback loop without a full IDE. It is
Rust/cargo-focused; if you need a language-agnostic runner that executes
arbitrary commands on file change, use `watchexec` instead.
"""

alternatives = ["watchexec", "cargo-watch (deprecated)"]
recommended = true

