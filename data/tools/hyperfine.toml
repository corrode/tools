id = "hyperfine"
name = "hyperfine"
repository = "https://github.com/sharkdp/hyperfine"
category = "performance"
crate = "hyperfine"

remarks = """
A command-line benchmarking tool that runs a program many times, performs warmup
runs, and reports mean/stddev with statistical analysis and outlier detection.
Supports parameterized runs and exporting results to JSON/CSV/Markdown.

Use it to compare whole programs or shell commands (e.g. two CLI builds) under
realistic conditions. It measures process start-to-finish time, so it cannot
profile in-process functions; for that use `criterion` or `divan`.
"""

alternatives = ["criterion", "divan"]

