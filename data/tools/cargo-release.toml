id = "cargo-release"
name = "cargo-release"
repository = "https://github.com/crate-ci/cargo-release"
category = "release"
crate = "cargo-release"

remarks = """
Automates the mechanics of cutting a release: bumps the version, commits, creates
a git tag, runs `cargo publish`, and applies a post-release dev-version bump,
with workspace support.

Reach for it when you want explicit, command-driven control over each release
step. If you prefer a fully automated, PR-based flow that derives versions from
conventional commits, use `release-plz` instead; for changelog generation pair
it with `git-cliff`.
"""

alternatives = ["release-plz", "cargo-dist"]

