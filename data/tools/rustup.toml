id = "rustup"
name = "rustup"
repository = "https://github.com/rust-lang/rustup"
category = "toolchain"

remarks = """
The official Rust toolchain installer and version manager. Installs and
switches between stable, beta, and nightly toolchains, manages components
(clippy, rustfmt, rust-src) and cross-compilation targets, and pins a
per-project toolchain via `rust-toolchain.toml`.

Effectively mandatory: almost every other tool here assumes a rustup-managed
toolchain. The only time you'd skip it is a fully pinned distro/Nix or CI image
that provisions toolchains some other way.
"""

alternatives = ["rustup-toolchain-install-master", "Nix (oxalica/rust-overlay)"]
recommended = true

