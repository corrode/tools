id = "cargo-binstall"
name = "cargo-binstall"
repository = "https://github.com/cargo-bins/cargo-binstall"
category = "toolchain"
crate = "cargo-binstall"

remarks = """
Installs Rust binaries from pre-built GitHub release artifacts instead of
compiling from source, turning a multi-minute `cargo install` into a download.
Falls back to building from source when no prebuilt binary is published.

Reach for it in CI and on dev machines to install tools fast. Skip it if you
need a build from source for provenance/audit reasons, or for crates that ship
no release binaries (where it gains you nothing over `cargo install`).
"""

alternatives = ["cargo-install", "cargo-quickinstall"]

