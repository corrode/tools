id = "cargo-vet"
name = "cargo-vet"
repository = "https://github.com/mozilla/cargo-vet"
category = "security"
crate = "cargo-vet"

remarks = """
A supply-chain tool to record and enforce that each dependency has been
human-reviewed, storing audit records that can be shared across an organization.

Run `cargo vet` in CI to require that new or updated crates have a recorded
audit before they are accepted. Designed for teams that perform source review;
it tracks human judgment rather than scanning for known vulnerabilities like
`cargo-audit`. Overkill for a small solo project.
"""

alternatives = ["cargo-audit", "cargo-deny"]

