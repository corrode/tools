id = "cargo-chef"
name = "cargo-chef"
repository = "https://github.com/LukeMathWalker/cargo-chef"
category = "build"
crate = "cargo-chef"

remarks = """
Speeds up Docker builds by caching your dependency compilation as a separate,
stable image layer. It computes a `recipe.json` from your manifests, cooks the
dependencies once, and only rebuilds them when `Cargo.toml`/`Cargo.lock`
change, so editing application code no longer recompiles the whole tree.

Specifically a Docker/CI optimization. It does nothing for local `cargo build`,
and outside containerized builds you want `sccache` or plain incremental builds
instead.
"""

alternatives = ["sccache", "Docker BuildKit cache mounts"]
recommended = true

